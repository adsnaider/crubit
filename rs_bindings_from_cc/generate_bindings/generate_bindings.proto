syntax = "proto3";

package crubit.rs_bindings_from_cc.generate_bindings;

import "rs_bindings_from_cc/ir.proto";

// Parameters for invoking the Rust (backend) binding generator.
message GenerateBindingsRequest {
  // Proto representation of the intermediate representation produced by the
  // C++ importer.
  crubit.rs_bindings_from_cc.ir_proto.flat.IRProto ir_proto = 1;
  // Format string for the path to the Crubit support libraries.
  string crubit_support_path_format = 2;
  string crubit_support_versioned_path_format = 3;
  // Path to the clang-format executable.
  string clang_format_exe_path = 4;
  // Path to the rustfmt executable.
  string rustfmt_exe_path = 5;
  // Path to the rustfmt configuration file.
  string rustfmt_config_path = 6;
  // When true, the generator will populate the `error_report` field in the
  // response with a JSON-formatted diagnostic report.
  bool generate_error_report = 7;
  // If true, Crubit will skip embedding the original C++ source location and
  // enabled features inside the generated Rust/C++ documentation comments.
  // Generally set to true golden file tests to ensure test outputs are
  // deterministic, and false in production.
  bool is_golden_test = 8;
  bool kythe_annotations = 9;
  string kythe_default_corpus = 10;
  // If set, the generator writes a zngur `.zng` file (`zng` in the response)
  // instead of the bindings.
  ZngOptions zng_options = 11;
}

// Options of the zngur `.zng` file (see `generate_zng.rs`).
message ZngOptions {
  // The output path of the `.zng` file, which the paths of imports and merges
  // are written relative to.
  string zng_out = 1;
  // The Rust crate of the zngur bindings. Defaults to the target's crate name.
  string crate_name = 2;
  // The `.zng` files of dependency targets.
  repeated ZngImport imports = 3;
  // Hand-written `.zng` files that the generated file merges.
  repeated string merges = 4;
}

message ZngImport {
  // The dependency target, e.g. `//foo:bar`.
  string target = 1;
  // The path of its `.zng` file.
  string zng_file = 2;
}

// Encapsulates the successful or failed output of binding generation.
message GenerateBindingsResponse {
  string rs_api = 1;
  string rs_api_impl = 2;
  // JSON-formatted diagnostic information detailing any warnings or non-fatal
  // errors hit during generation.
  string error_report = 3;
  // Text description of a fatal error that aborted generation.
  // If this string is not empty, generation has failed and other fields in
  // this message should be ignored.
  string fatal_errors = 4;
  // The `.zng` file, if `zng_options` was set in the request.
  string zng = 5;
}
